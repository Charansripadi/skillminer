[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skillminer"
version = "0.1.0"
description = "Mine recurring workflows from agent session traces and turn them into validated Agent Skills (SKILL.md)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Sri Charan Sripadi" }]
dependencies = [
    "google-adk>=2.10",
    "litellm>=1.50",
    "python-dotenv>=1.0",
    "scikit-learn>=1.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
skillminer-traces = "skillminer.capture.show:main"
skillminer-mine = "skillminer.mining.cli:main"
skillminer-write = "skillminer.write_cli:main"
skillminer-drift = "skillminer.drift:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skillminer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
